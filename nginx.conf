# DBExec-UI static server.
# Listens on the fixed UI port and serves the Angular SPA with a
# client-side-routing fallback: any unknown path returns index.html so
# the Angular router can handle it (deep links, refresh on a route).
server {
    listen 8755;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # i18n translation files are NOT fingerprinted — keep them fresh so
    # locale updates in a new image are picked up, not served from a
    # stale year-long cache.
    location /assets/i18n/ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Long-cache the fingerprinted build assets (filenames carry a hash,
    # so they can be cached hard and busted by name on the next build).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every route serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
