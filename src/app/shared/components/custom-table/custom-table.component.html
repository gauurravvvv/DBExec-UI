<div class="custom-table" [class.density-compact]="density === 'compact'">
  <!-- ── Slim toolbar: title (left) + global search + only the enabled
       secondary actions (right). Nothing else by default. ── -->
  <div class="ct-toolbar">
    <div class="ct-toolbar-left">
      <span class="ct-title" *ngIf="cfg.title">{{ cfg.title }}</span>
      <!-- Host-projected controls on the toolbar's left (e.g. a datasource
           picker + segmented filter), so they share the table's single row. -->
      <ng-content select="[tableToolbarStart]"></ng-content>
    </div>

    <div class="ct-toolbar-right">
      <!-- The one always-on search — shared input for a unified look. -->
      <div class="ct-search" *ngIf="cfg.globalSearch">
        <app-custom-input
          [ngModel]="globalSearch"
          (ngModelChange)="onGlobalSearch($event)"
          icon="pi-search"
          [placeholder]="cfg.globalSearchPlaceholder || ('COMMON.SEARCH' | translate)"
        ></app-custom-input>
      </div>

      <!-- Filter toggle (only if any column is filterable) -->
      <button
        *ngIf="cfg.showColumnFilters && hasColumnFilters"
        type="button"
        class="ct-icon-btn"
        [class.active]="showFilters"
        (click)="toggleFilters()"
        [pTooltip]="'COMMON.FILTERS' | translate"
        tooltipPosition="bottom"
      >
        <i class="pi pi-filter"></i>
      </button>

      <!-- Density (compact / comfortable) -->
      <button
        *ngIf="cfg.enableDensity"
        type="button"
        class="ct-icon-btn"
        (click)="setDensity(density === 'compact' ? 'comfortable' : 'compact')"
        [pTooltip]="(density === 'compact' ? 'COMMON.COMFORTABLE' : 'COMMON.COMPACT') | translate"
        tooltipPosition="bottom"
      >
        <i class="pi" [ngClass]="density === 'compact' ? 'pi-arrows-v' : 'pi-bars'"></i>
      </button>

      <!-- Columns show/hide -->
      <ng-container *ngIf="cfg.enableColumnToggle">
        <button
          type="button"
          class="ct-icon-btn"
          (click)="colMenu.toggle($event)"
          [pTooltip]="'COMMON.COLUMNS' | translate"
          tooltipPosition="bottom"
        >
          <i class="pi pi-table"></i>
        </button>
        <p-menu #colMenu [model]="columnMenuItems" [popup]="true" appendTo="body"></p-menu>
      </ng-container>

      <!-- Export CSV / Excel -->
      <ng-container *ngIf="cfg.enableExport">
        <button
          type="button"
          class="ct-icon-btn"
          (click)="exportMenu.toggle($event)"
          [pTooltip]="'COMMON.EXPORT' | translate"
          tooltipPosition="bottom"
        >
          <i class="pi pi-download"></i>
        </button>
        <p-menu #exportMenu [model]="exportMenuItems" [popup]="true" appendTo="body"></p-menu>
      </ng-container>

      <!-- Refresh (host owns the action) -->
      <button
        type="button"
        class="ct-icon-btn"
        (click)="doRefresh()"
        [pTooltip]="'COMMON.REFRESH' | translate"
        tooltipPosition="bottom"
      >
        <i class="pi" [ngClass]="loading ? 'pi-spin pi-spinner' : 'pi-refresh'"></i>
      </button>
    </div>
  </div>

  <!-- ── Table ──
       Plain (non-virtualised) scroll: every accumulated row is rendered
       normally, so rows can be any height and borders behave — no vanishing
       / recycling glitches. Scroll-mode fetches the next page when the
       scroll body nears the bottom (see ngAfterViewInit → onScroll). ── -->
  <p-table
    #dt
    [value]="rows"
    [lazy]="true"
    [loading]="loading && !loadingMore"
    [scrollable]="true"
    [scrollHeight]="scrollHeight"
    [rowTrackBy]="trackRow"
    (onLazyLoad)="onLazyLoad($event)"
    responsiveLayout="scroll"
    styleClass="ct-p-table"
  >
    <ng-template pTemplate="header">
      <tr>
        <th
          *ngFor="let c of visibleColumns"
          [pSortableColumn]="c.sortable !== false ? (c.field || c.colId) : undefined"
          [ngStyle]="colStyle(c)"
          [class.ct-frozen]="c.frozen"
          [class.ct-right]="align(c) === 'right'"
          [class.ct-center]="align(c) === 'center'"
        >
          <span class="ct-th">
            {{ c.header }}
            <p-sortIcon
              *ngIf="c.sortable !== false"
              [field]="c.field || c.colId"
            ></p-sortIcon>
          </span>
        </th>
      </tr>

      <!-- On-demand per-column filter row — shared inputs (unified look). -->
      <tr class="ct-filter-row" *ngIf="showFilters && hasColumnFilters">
        <th *ngFor="let c of visibleColumns" [ngStyle]="colStyle(c)">
          <app-custom-input
            *ngIf="c.filter === 'text' || c.filter === 'numeric'"
            [type]="c.filter === 'numeric' ? 'number' : 'text'"
            [ngModel]="columnFilters[c.colId]"
            (ngModelChange)="onColumnFilter(c.colId, $event)"
            [placeholder]="'COMMON.FILTER' | translate"
            styleClass="ct-filter-input"
          ></app-custom-input>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td
          *ngFor="let c of visibleColumns"
          [ngStyle]="colStyle(c)"
          [class.ct-frozen]="c.frozen"
          [class.ct-right]="align(c) === 'right'"
          [class.ct-center]="align(c) === 'center'"
          [class.ct-mono]="c.numeric"
        >
          <ng-container
            *ngIf="templateFor(c.colId) as tpl; else defaultCell"
            [ngTemplateOutlet]="tpl"
            [ngTemplateOutletContext]="{ $implicit: row, row: row }"
          ></ng-container>
          <ng-template #defaultCell>{{ row[c.field || c.colId] }}</ng-template>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="visibleColumns.length" class="ct-empty">
          <i class="pi pi-inbox"></i>
          <span>{{ cfg.emptyMessage || ('COMMON.NO_RECORDS' | translate) }}</span>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- ── Footer ── -->
  <!-- Scroll mode: no page controls — just a quiet count / loading line. -->
  <div class="ct-scroll-footer" *ngIf="serverAdapter && isScroll">
    <span class="ct-count" *ngIf="!loadingMore">
      {{ 'COMMON.SHOWING_OF' | translate: { shown: rows.length, total: total } }}
    </span>
    <span class="ct-count loading" *ngIf="loadingMore">
      <i class="pi pi-spin pi-spinner"></i> {{ 'COMMON.LOADING' | translate }}
    </span>
  </div>

  <!-- Paginate mode: classic shared paginator. -->
  <us-paginator
    *ngIf="serverAdapter && !isScroll"
    [page]="page"
    [limit]="limit"
    [total]="total"
    [pageSizeOptions]="cfg.pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (limitChange)="onLimitChange($event)"
  ></us-paginator>
</div>
