<!-- Compact live agent → API telemetry line. Click to expand the step tree. -->
<div class="ai-act" [class.ai-act--active]="active">
  <button
    type="button"
    class="ai-act__line"
    [class.ai-act__line--clickable]="hasSteps"
    [disabled]="!hasSteps"
    (click)="toggle()"
    [attr.aria-expanded]="expanded()"
  >
    <span class="ai-act__gear" [class.ai-act__gear--spin]="active">
      <i class="pi pi-cog"></i>
    </span>
    <span class="ai-act__agent" *ngIf="agent">{{ agent }}</span>
    <ng-container *ngIf="api">
      <i class="pi pi-arrow-right ai-act__arrow"></i>
      <code class="ai-act__api">{{ api }}</code>
    </ng-container>
    <span class="ai-act__elapsed" *ngIf="elapsedLabel">·&nbsp;{{ elapsedLabel }}</span>
    <i
      class="pi ai-act__caret"
      [class.pi-angle-right]="!expanded()"
      [class.pi-angle-down]="expanded()"
      *ngIf="hasSteps"
    ></i>
  </button>

  <!-- Expanded: the full step tree (each tool call, args, preview, sub-steps). -->
  <div class="ai-act__detail" *ngIf="expanded() && hasSteps">
    <app-ai-tool-step
      *ngFor="let st of steps; trackBy: trackStep"
      [step]="st"
    ></app-ai-tool-step>
  </div>
</div>
