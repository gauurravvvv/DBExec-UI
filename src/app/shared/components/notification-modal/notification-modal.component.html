<app-command-modal
  [isOpen]="isOpen()"
  [showInput]="false"
  [title]="'HEADER.NOTIFICATIONS' | translate"
  [headerActionLabel]="
    hasNotifications && hasUnread ? ('HEADER.MARK_ALL_READ' | translate) : null
  "
  (headerAction)="onMarkAllRead()"
  (closed)="close()"
>
  <ng-container *ngIf="hasNotifications; else emptyState">
    <!-- Actions toolbar — Clear removes all READ rows. -->
    <div class="notification-toolbar" *ngIf="hasRead">
      <button type="button" class="notification-clear" (click)="onClear()">
        <i class="pi pi-trash" aria-hidden="true"></i>
        {{ 'HEADER.CLEAR' | translate }}
      </button>
    </div>

    <ng-container *ngFor="let group of groupedItems(); trackBy: trackByBucket">
      <div class="group-header">{{ group.label | translate }}</div>
      <ul class="notification-rows">
        <li
          *ngFor="let n of group.items; trackBy: trackById"
          class="notification-row"
          [class.unread]="!n.readAt"
          [class.clickable]="hasRoute(n)"
          (click)="onRowClick(n)"
        >
          <div
            class="notification-icon"
            [style.color]="accentFor(n.type)"
            [style.background]="
              'color-mix(in srgb, ' + accentFor(n.type) + ' 12%, transparent)'
            "
          >
            <i class="pi" [ngClass]="iconFor(n.type)" aria-hidden="true"></i>
          </div>
          <div class="notification-content">
            <div class="row-title">{{ titleKeyFor(n) | translate }}</div>
            <div class="row-message">
              {{ bodyKeyFor(n) | translate: bodyParams(n) }}
            </div>
          </div>
          <span class="row-time" [title]="n.createdOn | date: 'medium'">
            {{ n.createdOn | relativeTime }}
          </span>
          <button
            type="button"
            class="row-delete"
            [attr.aria-label]="'HEADER.DELETE_NOTIFICATION' | translate"
            (click)="onDelete($event, n)"
          >
            <i class="pi pi-times" aria-hidden="true"></i>
          </button>
        </li>
      </ul>
    </ng-container>

    <!-- Footer — jump to the dedicated full-page feed (filters, bulk
         actions, the complete history). -->
    <div class="notification-footer">
      <button type="button" class="notification-see-all" (click)="seeAll()">
        {{ 'NOTIFICATION.SEE_ALL' | translate }}
        <i class="pi pi-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </ng-container>

  <ng-template #emptyState>
    <div class="empty-state">
      <div class="empty-state-icon">
        <i class="pi pi-check-circle" aria-hidden="true"></i>
      </div>
      <p class="empty-state-title">{{ 'HEADER.ALL_CAUGHT_UP' | translate }}</p>
      <p class="empty-state-hint">
        {{ 'NOTIFICATION.EMPTY_HINT' | translate }}
      </p>
    </div>
  </ng-template>
</app-command-modal>
