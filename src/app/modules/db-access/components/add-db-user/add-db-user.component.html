<div class="add-admin-wrapper">
  <div class="add-admin-container">
    <!-- Header -->
    <div class="page-header">
      <div class="left-section">
        <button
          pButton
          class="p-button-text back-button"
          [routerLink]="['/app/db-access', datasourceId]"
        >
          <i class="pi pi-arrow-left"></i>
        </button>
        <h2>{{ 'DB_ACCESS.CREATE_USER' | translate }}</h2>
      </div>
      <div class="action-buttons">
        <button
          pButton
          type="button"
          [label]="'COMMON.CANCEL' | translate"
          class="p-button-outlined btn-cancel"
          (click)="onCancel()"
        ></button>
        <button
          *hasPermission="'manageDatabaseAccess'; level: 'write'"
          pButton
          class="p-button-primary btn-save"
          type="button"
          [label]="'DB_ACCESS.REVIEW_SQL' | translate"
          (click)="onSubmit()"
          [disabled]="userForm.invalid || saving()"
        >
          <i
            class="pi mr-2"
            [ngClass]="saving() ? 'pi-spin pi-spinner' : 'pi-eye'"
          ></i>
        </button>
      </div>
    </div>

    <!-- Form -->
    <form [formGroup]="userForm" class="admin-form">
      <div class="left-section">
        <div class="form-grid">
          <!-- Role name -->
          <app-custom-input
            formControlName="name"
            [label]="'DB_ACCESS.ROLE_NAME' | translate"
            [placeholder]="'DB_ACCESS.ROLE_NAME_PLACEHOLDER' | translate"
            icon="pi-user"
            [required]="true"
            [showError]="
              !!(userForm.get('name')?.invalid && userForm.get('name')?.touched)
            "
            [errorMessage]="getErrorMessage('name')"
          ></app-custom-input>

          <!-- Password -->
          <app-custom-input
            formControlName="password"
            [label]="'DB_ACCESS.PASSWORD' | translate"
            type="password"
            icon="pi-lock"
            [showPasswordToggle]="true"
            [placeholder]="'DB_ACCESS.PASSWORD_PLACEHOLDER' | translate"
          ></app-custom-input>

          <!-- Connection limit -->
          <app-custom-number
            formControlName="connectionLimit"
            [label]="'DB_ACCESS.CONN_LIMIT' | translate"
            [min]="-1"
            [placeholder]="'DB_ACCESS.UNLIMITED' | translate"
          ></app-custom-number>

          <!-- Expiry -->
          <app-custom-calendar
            formControlName="validUntil"
            [label]="'DB_ACCESS.VALID_UNTIL' | translate"
            [showTime]="false"
            [showButtonBar]="true"
          ></app-custom-calendar>

          <!-- Attributes -->
          <h3 class="form-section-title">
            {{ 'DB_ACCESS.ATTRIBUTES' | translate }}
          </h3>
          <div class="attr-toggles">
            <label class="attr-toggle">
              <span class="attr-meta">
                <span class="attr-name">INHERIT</span>
                <span class="attr-desc">{{ 'DB_ACCESS.ATTR_INHERIT' | translate }}</span>
              </span>
              <p-inputSwitch formControlName="inherit"></p-inputSwitch>
            </label>
            <label class="attr-toggle">
              <span class="attr-meta">
                <span class="attr-name">CREATEDB</span>
                <span class="attr-desc">{{ 'DB_ACCESS.ATTR_CREATEDB' | translate }}</span>
              </span>
              <p-inputSwitch formControlName="createdb"></p-inputSwitch>
            </label>
            <label class="attr-toggle">
              <span class="attr-meta">
                <span class="attr-name">CREATEROLE</span>
                <span class="attr-desc">{{ 'DB_ACCESS.ATTR_CREATEROLE' | translate }}</span>
              </span>
              <p-inputSwitch formControlName="createrole"></p-inputSwitch>
            </label>
            <label class="attr-toggle">
              <span class="attr-meta">
                <span class="attr-name">REPLICATION</span>
                <span class="attr-desc">{{ 'DB_ACCESS.ATTR_REPLICATION' | translate }}</span>
              </span>
              <p-inputSwitch formControlName="replication"></p-inputSwitch>
            </label>
            <label class="attr-toggle danger">
              <span class="attr-meta">
                <span class="attr-name">SUPERUSER</span>
                <span class="attr-desc">{{ 'DB_ACCESS.ATTR_SUPERUSER' | translate }}</span>
              </span>
              <p-inputSwitch formControlName="superuser"></p-inputSwitch>
            </label>
            <label class="attr-toggle danger">
              <span class="attr-meta">
                <span class="attr-name">BYPASSRLS</span>
                <span class="attr-desc">{{ 'DB_ACCESS.ATTR_BYPASSRLS' | translate }}</span>
              </span>
              <p-inputSwitch formControlName="bypassrls"></p-inputSwitch>
            </label>
          </div>

          <!-- Attach to app user / group -->
          <h3 class="form-section-title">
            {{ 'DB_ACCESS.ATTACH_MAPPING' | translate }}
          </h3>
          <p class="form-hint">{{ 'DB_ACCESS.ATTACH_HINT' | translate }}</p>

          <app-custom-multiselect
            formControlName="appUserIds"
            [options]="appUserOptions"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [label]="'DB_ACCESS.APP_USERS' | translate"
            [placeholder]="'DB_ACCESS.SELECT_APP_USERS' | translate"
            icon="pi-user"
          ></app-custom-multiselect>

          <app-custom-multiselect
            formControlName="appGroupIds"
            [options]="appGroupOptions"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [label]="'DB_ACCESS.APP_GROUPS' | translate"
            [placeholder]="'DB_ACCESS.SELECT_APP_GROUPS' | translate"
            icon="pi-users"
          ></app-custom-multiselect>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Plain-language change-summary confirm gate -->
<app-change-summary-dialog
  [visible]="showPreview"
  [title]="previewTitle"
  [summaries]="summaries"
  [destructive]="previewDestructive"
  [confirmPhrase]="confirmPhrase"
  [loading]="previewLoading"
  [executing]="saving()"
  (confirmed)="confirmPreview()"
  (cancelled)="cancelPreview()"
></app-change-summary-dialog>
