<div class="save-analysis-popup" *ngIf="visible">
  <div class="popup-content">
    <h3>{{ dialogTitle }}</h3>
    <form autocomplete="off" [formGroup]="analysisForm" class="analysis-form">
      <!-- Analysis Name -->
      <div class="form-field">
        <app-custom-input
          formControlName="name"
          [label]="'COMMON.NAME' | translate"
          [placeholder]="'ANALYSES.ENTER_ANALYSIS_NAME' | translate"
          icon="pi-id-card"
          [required]="true"
          [showError]="
            !!(
              analysisForm.get('name')?.invalid &&
              analysisForm.get('name')?.touched
            )
          "
          [errorMessage]="getNameError()"
        >
        </app-custom-input>
      </div>

      <!-- Description -->
      <div class="form-field">
        <app-custom-input
          formControlName="description"
          [label]="'COMMON.DESCRIPTION' | translate"
          [placeholder]="'ANALYSES.ENTER_ANALYSIS_DESCRIPTION' | translate"
          icon="pi-align-left"
        >
        </app-custom-input>
        <small class="char-count">
          {{ analysisForm.get('description')?.value?.length || 0 }}/500
          {{ 'ANALYSES.CHARACTERS' | translate }}
        </small>
      </div>

      <!-- Justification (for updates only) -->
      <div class="form-field justification-field" *ngIf="showJustification">
        <label for="saveJustification"
          >{{ 'COMMON.JUSTIFICATION' | translate }}
          <span class="required">*</span></label
        >
        <app-custom-textarea
          inputId="saveJustification"
          [(ngModel)]="saveJustification"
          [ngModelOptions]="{ standalone: true }"
          [placeholder]="'ANALYSES.PROVIDE_UPDATE_REASON' | translate"
          [rows]="3"
          [maxLength]="500"
        ></app-custom-textarea>
        <small class="char-count">{{ saveJustification.length }}/500</small>
      </div>

      <div class="popup-actions">
        <app-button variant="secondary" (clicked)="onCancel()"
          >{{ 'COMMON.CANCEL' | translate }}</app-button
        >
        <app-button
          variant="primary"
          icon="pi pi-save"
          [loading]="saving"
          [disabled]="
            analysisForm.invalid ||
            (showJustification && !saveJustification.trim()) ||
            saving
          "
          (clicked)="onSubmit()"
          >{{ 'ANALYSES.SAVE_ANALYSIS' | translate }}</app-button
        >
      </div>
    </form>
  </div>
</div>
