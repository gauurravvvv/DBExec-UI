<!-- Query Runner launcher — canonical add/edit-FORM chrome (not list chrome):
     add-admin-wrapper > add-admin-container > page-header + <form> with a
     left-aligned 50% form-grid, matching Add User / Add Role. -->
<div class="add-admin-wrapper">
  <div class="add-admin-container">
    <div class="page-header">
      <div class="left-section">
        <button pButton class="p-button-text back-button" (click)="goBack()">
          <i class="pi pi-arrow-left"></i>
        </button>
        <h2>{{ 'QUERY_RUNNER.TITLE' | translate }}</h2>
      </div>
      <div class="action-buttons">
        <button
          pButton
          type="button"
          [label]="'QUERY_RUNNER.MANAGE_CONNECTIONS' | translate"
          icon="pi pi-cog"
          [routerLink]="['/app/query-runner/connections']"
          class="p-button-outlined btn-cancel"
        ></button>
      </div>
    </div>

    <form class="admin-form" (ngSubmit)="open()">
      <div class="left-section">
        <div class="form-grid">
          <!-- Intro badge + copy, sitting above the fields like a form lead-in -->
          <div class="launcher-intro">
            <div class="launcher-badge"><i class="pi pi-play"></i></div>
            <div>
              <h3>{{ 'QUERY_RUNNER.LAUNCH_TITLE' | translate }}</h3>
              <p>{{ 'QUERY_RUNNER.LAUNCH_SUBTITLE' | translate }}</p>
            </div>
          </div>

          <!-- Empty state: no connections yet -->
          <div class="launcher-empty" *ngIf="!connectionsLoading && hasNoConnections">
            <i class="pi pi-link"></i>
            <p>{{ 'QUERY_RUNNER.NO_CONNECTIONS_HINT' | translate }}</p>
            <button
              *hasPermission="'connectionManager'; level: 'write'"
              pButton
              type="button"
              [label]="'QUERY_RUNNER.NEW_CONNECTION' | translate"
              icon="pi pi-plus"
              (click)="createConnection()"
              class="p-button-primary btn-save"
            ></button>
          </div>

          <ng-container *ngIf="!hasNoConnections">
            <!-- Datasource -->
            <app-custom-dropdown
              [ngModel]="selectedDatasourceId"
              [ngModelOptions]="{ standalone: true }"
              (onChangeEvent)="onDatasourceChange($event)"
              [label]="'QUERY_RUNNER.STEP_DATASOURCE' | translate"
              [serverMode]="true"
              [fetcher]="loadDatasourcesPage"
              [pageSize]="10"
              optionLabel="name"
              optionValue="id"
              [filter]="true"
              filterBy="name"
              [showClear]="true"
              appendTo="body"
              icon="pi-database"
              [placeholder]="'QUERY_RUNNER.SELECT_DATASOURCE' | translate"
            ></app-custom-dropdown>

            <!-- Connection (enabled once a datasource is chosen) -->
            <div>
              <app-custom-dropdown
                [(ngModel)]="selectedConnectionId"
                [ngModelOptions]="{ standalone: true }"
                [label]="'QUERY_RUNNER.STEP_CONNECTION' | translate"
                [options]="connectionOptions"
                optionLabel="label"
                optionValue="value"
                [filter]="true"
                filterBy="label"
                [showClear]="true"
                appendTo="body"
                icon="pi-link"
                [disabled]="!selectedDatasourceId"
                [placeholder]="(selectedDatasourceId ? 'QUERY_RUNNER.SELECT_CONNECTION' : 'QUERY_RUNNER.SELECT_DATASOURCE_FIRST') | translate"
              ></app-custom-dropdown>
              <small class="form-hint warn" *ngIf="selectedDatasourceId && connectionOptions.length === 0 && !allDisabledForDs">
                {{ 'QUERY_RUNNER.NO_CONNECTIONS_FOR_DS' | translate }}
              </small>
              <small class="form-hint warn" *ngIf="allDisabledForDs">
                {{ 'QUERY_RUNNER.ALL_DISABLED_FOR_DS' | translate }}
              </small>
            </div>

            <!-- Primary action — right-aligned like a form's Save. -->
            <div class="launcher-actions">
              <button
                pButton
                type="submit"
                [label]="(verifying ? 'QUERY_RUNNER.VERIFYING' : 'QUERY_RUNNER.OPEN_EXECUTOR') | translate"
                [disabled]="!canOpen"
                class="p-button-primary btn-save"
              >
                <i class="pi mr-2" [ngClass]="verifying ? 'pi-spin pi-spinner' : 'pi-external-link'"></i>
              </button>
            </div>
          </ng-container>
        </div>
      </div>
    </form>
  </div>
</div>
