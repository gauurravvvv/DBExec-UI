<!-- New-Query popup — `.confirmation-popup` overlay (app dialog pattern),
     NOT a p-dialog. Datasource → connection selection reused from the
     retired launcher; "Open Executor" opens a blank executor tab. -->
<div class="confirmation-popup" (click)="close()">
  <div class="popup-content nq-content" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <div class="popup-icon"><i class="pi pi-play"></i></div>
      <h3>{{ 'QUERY_RUNNER.NEW_QUERY' | translate }}</h3>
    </div>

    <div class="popup-body">
      <p class="nq-subtitle">{{ 'QUERY_RUNNER.NEW_QUERY_SUBTITLE' | translate }}</p>

      <!-- Empty state: no connections yet -->
      <div class="nq-empty" *ngIf="!connectionsLoading && hasNoConnections">
        <i class="pi pi-link"></i>
        <p>{{ 'QUERY_RUNNER.NO_CONNECTIONS_HINT' | translate }}</p>
      </div>

      <ng-container *ngIf="!hasNoConnections">
        <!-- Datasource -->
        <app-custom-dropdown
          [ngModel]="selectedDatasourceId"
          [ngModelOptions]="{ standalone: true }"
          (onChangeEvent)="onDatasourceChange($event)"
          [label]="'QUERY_RUNNER.STEP_DATASOURCE' | translate"
          [serverMode]="true"
          [fetcher]="loadDatasourcesPage"
          [pageSize]="10"
          optionLabel="name"
          optionValue="id"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          appendTo="body"
          icon="pi-database"
          [placeholder]="'QUERY_RUNNER.SELECT_DATASOURCE' | translate"
        ></app-custom-dropdown>

        <!-- Connection (enabled once a datasource is chosen) -->
        <div>
          <app-custom-dropdown
            [(ngModel)]="selectedConnectionId"
            [ngModelOptions]="{ standalone: true }"
            [label]="'QUERY_RUNNER.STEP_CONNECTION' | translate"
            [options]="connectionOptions"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            appendTo="body"
            icon="pi-link"
            [disabled]="!selectedDatasourceId"
            [placeholder]="(selectedDatasourceId ? 'QUERY_RUNNER.SELECT_CONNECTION' : 'QUERY_RUNNER.SELECT_DATASOURCE_FIRST') | translate"
          ></app-custom-dropdown>
          <small class="form-hint warn" *ngIf="selectedDatasourceId && connectionOptions.length === 0 && !allDisabledForDs">
            {{ 'QUERY_RUNNER.NO_CONNECTIONS_FOR_DS' | translate }}
          </small>
          <small class="form-hint warn" *ngIf="allDisabledForDs">
            {{ 'QUERY_RUNNER.ALL_DISABLED_FOR_DS' | translate }}
          </small>
        </div>
      </ng-container>
    </div>

    <div class="popup-actions">
      <button class="btn-cancel" (click)="close()">
        <i class="pi pi-times"></i>{{ 'COMMON.CANCEL' | translate }}
      </button>
      <button class="btn-confirm" (click)="open()" [disabled]="!canOpen">
        <i class="pi mr-2" [ngClass]="verifying ? 'pi-spin pi-spinner' : 'pi-external-link'"></i>
        {{ (verifying ? 'QUERY_RUNNER.VERIFYING' : 'QUERY_RUNNER.OPEN_EXECUTOR') | translate }}
      </button>
    </div>
  </div>
</div>
