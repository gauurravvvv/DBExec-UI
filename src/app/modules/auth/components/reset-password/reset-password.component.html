<app-auth-shell [cardTitle]="cardTitle()" [cardSubtitle]="cardSubtitle()">
  <!-- Loading state — branded spinner while verifyResetToken resolves. -->
  <div class="auth-status" *ngIf="pageState() === 'loading'">
    <app-content-loader minHeight="180px"></app-content-loader>
    <p class="auth-status__message">
      {{ 'AUTH.RESET.VERIFYING_MSG' | translate }}
    </p>
  </div>

  <!-- Valid state — show the new-password form -->
  <form
    autocomplete="off"
    id="auth-form"
    *ngIf="pageState() === 'valid'"
    [formGroup]="resetPasswordForm"
    (ngSubmit)="onSubmit()"
    class="auth-form"
    novalidate
  >
    <div
      class="auth-form__field"
      (focusin)="onPasswordFocus()"
      (focusout)="onPasswordBlur()"
    >
      <label class="auth-visually-hidden" for="rp-password">{{
        'AUTH.RESET.NEW_PASSWORD' | translate
      }}</label>
      <app-custom-input
        inputId="rp-password"
        formControlName="newPassword"
        [placeholder]="'AUTH.RESET.NEW_PASSWORD' | translate"
        icon="pi-lock"
        autocomplete="new-password"
        [ariaLabel]="'AUTH.RESET.NEW_PASSWORD' | translate"
        [showPasswordToggle]="true"
        [showError]="
          !!(
            resetPasswordForm.get('newPassword')?.invalid &&
            resetPasswordForm.get('newPassword')?.touched
          )
        "
        [errorMessage]="getPasswordError()"
      ></app-custom-input>
      <p
        class="auth-form__capslock"
        *ngIf="capsLockOn() && passwordFocused()"
        role="status"
        aria-live="polite"
      >
        <i class="pi pi-info-circle" aria-hidden="true"></i>
        {{ 'AUTH.FIELD.CAPS_LOCK' | translate }}
      </p>
    </div>

    <div class="auth-form__field">
      <label class="auth-visually-hidden" for="rp-confirm">{{
        'AUTH.FIELD.CONFIRM_PASSWORD' | translate
      }}</label>
      <app-custom-input
        inputId="rp-confirm"
        formControlName="confirmPassword"
        [placeholder]="'AUTH.FIELD.CONFIRM_PASSWORD' | translate"
        icon="pi-lock"
        autocomplete="new-password"
        [ariaLabel]="'AUTH.FIELD.CONFIRM_PASSWORD' | translate"
        [showPasswordToggle]="true"
        [showError]="
          !!(
            resetPasswordForm.get('confirmPassword')?.invalid &&
            resetPasswordForm.get('confirmPassword')?.touched
          )
        "
        [errorMessage]="'PASSWORD.CONFIRM_REQUIRED' | translate"
      ></app-custom-input>
      <small
        class="error-message"
        *ngIf="
          resetPasswordForm.errors?.['mismatch'] &&
          resetPasswordForm.get('confirmPassword')?.touched
        "
      >
        {{ 'PASSWORD.MISMATCH' | translate }}
      </small>
    </div>

    <div
      class="auth-form__error"
      role="alert"
      aria-live="polite"
      [class.is-empty]="!error()"
    >
      <ng-container *ngIf="error()">
        <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
        <span>{{ error() }}</span>
      </ng-container>
    </div>

    <button
      pButton
      type="submit"
      class="auth-form__submit"
      [label]="
        loading()
          ? ('AUTH.RESET.SUBMITTING' | translate)
          : ('AUTH.RESET.SUBMIT' | translate)
      "
      [disabled]="!isFormValid || loading()"
      [loading]="loading()"
    ></button>

    <div class="auth-form__footer-row">
      <a class="auth-form__link" [routerLink]="['/login']">{{
        'AUTH.SSO.BACK_TO_LOGIN' | translate
      }}</a>
    </div>
  </form>

  <!-- Invalid state — bad / expired / already-used reset link -->
  <div class="auth-status" *ngIf="pageState() === 'invalid'">
    <i
      class="pi pi-exclamation-triangle auth-status__icon auth-status__icon--error"
      aria-hidden="true"
    ></i>
    <p class="auth-status__message">
      {{ 'AUTH.RESET.INVALID_MSG' | translate }}
    </p>
    <div class="auth-form__footer-row">
      <a class="auth-form__link" [routerLink]="['/login']">{{
        'AUTH.SSO.BACK_TO_LOGIN' | translate
      }}</a>
    </div>
  </div>
</app-auth-shell>
