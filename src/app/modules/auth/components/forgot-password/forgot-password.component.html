<app-auth-shell
  [cardTitle]="'AUTH.FORGOT.TITLE' | translate"
  [cardSubtitle]="'AUTH.FORGOT.SUBTITLE' | translate"
>
  <form
    autocomplete="off"
    id="auth-form"
    [formGroup]="forgotPasswordForm"
    (ngSubmit)="onSubmit()"
    class="auth-form"
    novalidate
  >
    <div class="auth-form__field">
      <label class="auth-visually-hidden" for="fp-account">{{
        'AUTH.ORGANISATION' | translate
      }}</label>
      <app-custom-input
        inputId="fp-account"
        formControlName="organisation"
        [placeholder]="'AUTH.ORGANISATION' | translate"
        icon="pi-building"
        autocomplete="organization"
        [ariaLabel]="'AUTH.ORGANISATION' | translate"
        [showError]="
          !!(
            forgotPasswordForm.get('organisation')?.invalid &&
            forgotPasswordForm.get('organisation')?.touched
          )
        "
        [errorMessage]="getErrorMessage('organisation')"
      ></app-custom-input>
    </div>

    <div class="auth-form__field">
      <label class="auth-visually-hidden" for="fp-email">{{
        'AUTH.EMAIL' | translate
      }}</label>
      <app-custom-input
        inputId="fp-email"
        formControlName="email"
        [placeholder]="'AUTH.EMAIL' | translate"
        icon="pi-envelope"
        autocomplete="email"
        [ariaLabel]="'AUTH.EMAIL' | translate"
        [showError]="
          !!(
            forgotPasswordForm.get('email')?.invalid &&
            forgotPasswordForm.get('email')?.touched
          )
        "
        [errorMessage]="getErrorMessage('email')"
      ></app-custom-input>
    </div>

    <div
      class="auth-form__error"
      role="alert"
      aria-live="polite"
      [class.is-empty]="!error()"
    >
      <ng-container *ngIf="error()">
        <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
        <span>{{ error() }}</span>
      </ng-container>
    </div>

    <button
      pButton
      type="submit"
      class="auth-form__submit"
      [label]="
        loading()
          ? ('AUTH.FORGOT.SENDING' | translate)
          : canResend()
            ? ('AUTH.FORGOT.RESEND' | translate)
            : ('AUTH.FORGOT.SUBMIT' | translate)
      "
      [disabled]="
        forgotPasswordForm.invalid || (otpSent() && !canResend()) || loading()
      "
      [loading]="loading()"
    ></button>

    <div class="auth-form__info" *ngIf="otpSent() && !canResend()">
      <i class="pi pi-clock" aria-hidden="true"></i>
      <span
        >{{ 'AUTH.FORGOT.RESEND_IN' | translate }}
        <strong>{{ countdownDisplay() }}</strong></span
      >
    </div>

    <div class="auth-form__footer-row">
      <a class="auth-form__link" [routerLink]="['/login']">{{
        'AUTH.SSO.BACK_TO_LOGIN' | translate
      }}</a>
    </div>
  </form>
</app-auth-shell>
