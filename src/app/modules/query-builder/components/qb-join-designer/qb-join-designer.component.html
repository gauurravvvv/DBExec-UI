<div class="qb-joins">
  <header class="qb-joins__head">
    <div>
      <h2 class="qb-joins__title">
        {{ 'QUERY_BUILDER.JOINS' | translate }}
      </h2>
      <p class="qb-joins__sub">
        {{ 'QUERY_BUILDER.JOINS_HINT' | translate }}
      </p>
    </div>
    <div class="qb-joins__actions">
      <app-button
        variant="secondary"
        size="sm"
        icon="pi pi-plus"
        (clicked)="addJoin()"
      >
        {{ 'QUERY_BUILDER.ADD_JOIN' | translate }}
      </app-button>
      <app-button
        variant="primary"
        size="sm"
        icon="pi pi-save"
        [loading]="saving()"
        (clicked)="save()"
      >
        {{ 'COMMON.SAVE' | translate }}
      </app-button>
    </div>
  </header>

  <div class="qb-joins__loading" *ngIf="loading()">
    <p-skeleton height="4rem" styleClass="mb-2"></p-skeleton>
    <p-skeleton height="4rem"></p-skeleton>
  </div>

  <p class="qb-joins__empty" *ngIf="!loading() && !hasJoins()">
    {{ 'QUERY_BUILDER.NO_JOINS' | translate }}
  </p>

  <div class="qb-joins__list" *ngIf="!loading() && hasJoins()">
    <div
      class="qb-joins__card"
      *ngFor="let join of joins(); trackBy: trackByIndex; let i = index"
    >
      <div class="qb-joins__row">
        <app-custom-dropdown
          class="qb-joins__type"
          [label]="'QUERY_BUILDER.JOIN_TYPE' | translate"
          [options]="joinTypes"
          optionLabel="label"
          optionValue="value"
          [ngModel]="join.joinType"
          (onChangeEvent)="patch(i, 'joinType', $event)" />

        <app-custom-input
          [label]="'QUERY_BUILDER.LEFT_ALIAS' | translate"
          [ngModel]="join.leftAlias"
          (ngModelChange)="patch(i, 'leftAlias', $event)" />
        <app-custom-input
          [label]="'QUERY_BUILDER.LEFT_COLUMN' | translate"
          [ngModel]="join.leftColumn"
          (ngModelChange)="patch(i, 'leftColumn', $event)" />

        <app-button
          variant="ghost"
          size="sm"
          icon="pi pi-times"
          class="qb-joins__remove"
          [title]="'QUERY_BUILDER.REMOVE_JOIN' | translate"
          (clicked)="removeJoin(i)" />
      </div>

      <div class="qb-joins__row">
        <app-custom-input
          [label]="'QUERY_BUILDER.RIGHT_SCHEMA' | translate"
          [ngModel]="join.rightSchema"
          (ngModelChange)="patch(i, 'rightSchema', $event)" />
        <app-custom-input
          [label]="'QUERY_BUILDER.RIGHT_TABLE' | translate"
          [ngModel]="join.rightTable"
          (ngModelChange)="patch(i, 'rightTable', $event)" />
        <app-custom-input
          [label]="'QUERY_BUILDER.RIGHT_ALIAS' | translate"
          [ngModel]="join.rightAlias"
          (ngModelChange)="patch(i, 'rightAlias', $event)" />
        <app-custom-input
          [label]="'QUERY_BUILDER.RIGHT_COLUMN' | translate"
          [ngModel]="join.rightColumn"
          (ngModelChange)="patch(i, 'rightColumn', $event)" />

        <app-custom-dropdown
          class="qb-joins__card-cardinality"
          [label]="'QUERY_BUILDER.CARDINALITY' | translate"
          [options]="cardinalities"
          optionLabel="label"
          optionValue="value"
          [ngModel]="join.cardinality"
          (onChangeEvent)="patch(i, 'cardinality', $event)" />
      </div>
    </div>
  </div>
</div>
