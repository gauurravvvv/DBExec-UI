<div class="add-admin-wrapper">
  <div class="add-admin-container">
    <!-- Header Section -->
    <div class="page-header">
      <div class="left-section">
        <button
          pButton
          class="p-button-text p-button-plain back-button"
          routerLink="/app/query-builders"
        >
          <i class="pi pi-arrow-left back-icon"></i>
        </button>
        <h2>{{ name() || ('QUERY_BUILDER.FORM_DESIGNER' | translate) }}</h2>
      </div>
    </div>

    <p class="page-subtitle">
      {{ 'QUERY_BUILDER.DESIGN_SUBTITLE' | translate }}
    </p>

    <!-- Tab navigation -->
    <nav class="qb-design__tabs">
      <button
        *ngFor="let tab of tabs"
        type="button"
        class="qb-design__tab"
        [class.qb-design__tab--active]="activeTab() === tab.key"
        (click)="setTab(tab.key)"
      >
        <i [class]="tab.icon"></i>
        {{ tab.label | translate }}
      </button>
    </nav>

    <div class="qb-design__loading" *ngIf="loading()">
      <p-skeleton height="4rem" styleClass="mb-2"></p-skeleton>
      <p-skeleton height="16rem"></p-skeleton>
    </div>

    <section class="admin-form qb-design__panel" *ngIf="!loading()">
      <qb-form-designer
        *ngIf="activeTab() === 'form'"
        [queryBuilderId]="queryBuilderId()"
        [datasourceId]="datasourceId()"
      />

      <qb-join-designer
        *ngIf="activeTab() === 'joins'"
        [queryBuilderId]="queryBuilderId()"
      />

      <qb-output-columns
        *ngIf="activeTab() === 'columns'"
        [queryBuilderId]="queryBuilderId()"
      />

      <qb-settings
        *ngIf="activeTab() === 'settings'"
        [queryBuilderId]="queryBuilderId()"
      />
    </section>
  </div>
</div>
