<div class="add-admin-wrapper">
  <div class="add-admin-container">
    <!-- Header Section -->
    <div class="page-header">
      <div class="left-section">
        <button
          pButton
          class="p-button-text p-button-plain back-button"
          routerLink="/app/prompt"
        >
          <i class="pi pi-arrow-left back-icon"></i>
        </button>
        <h2>{{ 'PROMPT_MODULE.ADD_TITLE' | translate }}</h2>
      </div>
      <div class="action-buttons">
        <button
          pButton
          type="button"
          [label]="'COMMON.CANCEL' | translate"
          class="p-button-outlined btn-cancel"
          (click)="onCancel()"
        ></button>
        <button
          *hasPermission="'queryBuilderPrompt'; level: 'write'"
          pButton
          class="p-button-primary btn-save"
          type="submit"
          [label]="'COMMON.SAVE' | translate"
          (click)="onSubmit()"
          [disabled]="promptForm.invalid || saving()"
        >
          <i class="pi pi-save mr-2"></i>
        </button>
      </div>
    </div>

    <!-- Form Section -->
    <form autocomplete="off" [formGroup]="promptForm" class="admin-form">
      <div class="form-grid">
        <!-- Datasource -->
          <div class="form-field">
            <app-custom-dropdown
              formControlName="datasource"
              [label]="'COMMON.DATASOURCE' | translate"
              [placeholder]="'COMMON.SELECT_DATASOURCE' | translate"
              [serverMode]="true"
              [fetcher]="loadDatasourcesPage"
              [pageSize]="10"
              [preloadedItems]="preloadedDatasources"
              [preloadedTotal]="preloadedDatasourcesTotal"
              optionLabel="name"
              optionValue="id"
              [filter]="true"
              filterBy="name"
              [required]="true"
              icon="pi-database"
            >
            </app-custom-dropdown>
          </div>

          <!-- Name -->
          <div class="form-field">
            <app-custom-input
              formControlName="name"
              [label]="'COMMON.NAME' | translate"
              [placeholder]="'COMMON.ENTER_NAME' | translate"
              icon="pi-id-card"
              [required]="true"
              [showError]="
                !!(
                  promptForm.get('name')?.invalid &&
                  promptForm.get('name')?.touched
                )
              "
              [errorMessage]="getNameError()"
            >
            </app-custom-input>
          </div>

          <!-- Description -->
          <div class="form-field">
            <app-custom-input
              formControlName="description"
              [label]="'COMMON.DESCRIPTION' | translate"
              [placeholder]="'COMMON.ENTER_DESCRIPTION' | translate"
              icon="pi-align-left"
            >
            </app-custom-input>
          </div>

          <!-- Type -->
          <div class="form-field">
            <app-custom-dropdown
              formControlName="type"
              [label]="'PROMPT_MODULE.TYPE' | translate"
              [placeholder]="'PROMPT_MODULE.SELECT_TYPE' | translate"
              [options]="promptTypes"
              optionLabel="label"
              optionValue="value"
              [required]="true"
              icon="pi-sliders-h"
            >
            </app-custom-dropdown>
          </div>

          <!-- Group (optional) -->
          <div class="form-field">
            <app-custom-input
              formControlName="groupName"
              [label]="'PROMPT_MODULE.GROUP' | translate"
              [placeholder]="'PROMPT_MODULE.GROUP_PLACEHOLDER' | translate"
              icon="pi-folder"
            >
            </app-custom-input>
          </div>
      </div>
    </form>
  </div>
</div>
