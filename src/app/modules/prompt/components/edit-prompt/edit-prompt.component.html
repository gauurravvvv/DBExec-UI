<div class="add-admin-wrapper">
  <div class="add-admin-container">
    <!-- Header Section -->
    <div class="page-header">
      <div class="left-section">
        <button
          pButton
          class="p-button-text p-button-plain back-button"
          routerLink="/app/prompt"
        >
          <i class="pi pi-arrow-left back-icon"></i>
        </button>
        <h2>{{ 'PROMPT_MODULE.EDIT_TITLE' | translate }}</h2>
      </div>
      <div class="action-buttons">
        <app-button
          variant="secondary"
          [disabled]="!isFormDirty || isCancelClicked"
          (clicked)="onCancel()"
          >{{ 'COMMON.CANCEL' | translate }}</app-button
        >
        <app-button
          *hasPermission="'queryBuilderPrompt'; level: 'write'"
          variant="primary"
          icon="pi pi-save"
          [loading]="saving()"
          [disabled]="promptForm.invalid || !isFormDirty || saving()"
          (clicked)="onSubmit()"
          >{{ 'COMMON.SAVE' | translate }}</app-button
        >
      </div>
    </div>

    <!-- Form Section -->
    <form
      autocomplete="off"
      [formGroup]="promptForm"
      class="admin-form"
      #formContainer
    >
      <div class="form-grid">
        <!-- Name Field -->
          <div class="form-field">
            <app-custom-input
              formControlName="name"
              [label]="'COMMON.NAME' | translate"
              [placeholder]="'COMMON.ENTER_NAME' | translate"
              icon="pi-id-card"
              [required]="true"
              [showError]="
                !!(
                  promptForm.get('name')?.invalid &&
                  promptForm.get('name')?.touched
                )
              "
              [errorMessage]="getNameError()"
            >
            </app-custom-input>
          </div>

          <!-- Description Field -->
          <div class="form-field">
            <app-custom-input
              formControlName="description"
              [label]="'COMMON.DESCRIPTION' | translate"
              [placeholder]="'COMMON.ENTER_DESCRIPTION' | translate"
              icon="pi-align-left"
            >
            </app-custom-input>
          </div>

          <app-custom-input
            [ngModel]="selectedDatasourceName"
            [ngModelOptions]="{ standalone: true }"
            [label]="'COMMON.DATASOURCE' | translate"
            [placeholder]="'COMMON.DATASOURCE' | translate"
            icon="pi-database"
            [inputDisabled]="true"
          >
          </app-custom-input>

          <!-- Group (optional; buckets the prompt in the designer palette) -->
          <div class="form-field">
            <app-custom-input
              formControlName="groupName"
              [label]="'PROMPT_MODULE.GROUP' | translate"
              [placeholder]="'PROMPT_MODULE.GROUP_PLACEHOLDER' | translate"
              icon="pi-folder"
            >
            </app-custom-input>
          </div>

          <!-- Status -->
          <app-custom-toggle
            formControlName="status"
            [label]="'COMMON.STATUS' | translate"
            [trueValue]="1"
            [falseValue]="0"
            [trueLabel]="'COMMON.ACTIVE' | translate"
            [falseLabel]="'COMMON.INACTIVE' | translate"
          >
          </app-custom-toggle>
        </div>
    </form>
  </div>
</div>

<div class="confirmation-popup" *ngIf="showSaveConfirm">
  <div class="popup-content">
    <div class="popup-header">
      <div class="popup-icon">
        <i class="pi pi-save"></i>
      </div>
      <h3>{{ 'COMMON.CONFIRM_UPDATE' | translate }}</h3>
    </div>

    <div class="standard-delete-section">
      <p class="delete-intro">
        {{ 'PROMPT_MODULE.UPDATE_CONFIRM' | translate }}
      </p>

      <div class="justification-section">
        <label for="saveJustification"
          >{{ 'COMMON.JUSTIFICATION' | translate }}
          <span class="required">*</span></label
        >
        <app-custom-textarea
          inputId="saveJustification"
          [(ngModel)]="saveJustification"
          [placeholder]="'COMMON.JUSTIFICATION_UPDATE_PLACEHOLDER' | translate"
          [rows]="3"
          [maxLength]="500"
        ></app-custom-textarea>
        <small class="char-count">{{ saveJustification.length }}/500</small>
      </div>
    </div>

    <div class="popup-actions">
      <button class="btn-cancel" (click)="cancelSave()">
        <i class="pi pi-times"></i>
        {{ 'COMMON.CANCEL' | translate }}
      </button>
      <button
        class="btn-confirm"
        (click)="proceedSave()"
        [disabled]="!saveJustification.trim() || saving()"
      >
        <i
          class="pi"
          [ngClass]="saving() ? 'pi-spin pi-spinner' : 'pi-check'"
        ></i>
        {{ 'COMMON.UPDATE' | translate }}
      </button>
    </div>
  </div>
</div>
