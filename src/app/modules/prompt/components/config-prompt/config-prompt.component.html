<div class="cp">
  <!-- Page header: back-to-prompt + title + Back/Next/Save actions on top -->
  <div class="page-header">
    <div class="left-section">
      <button
        pButton
        class="p-button-text p-button-plain back-button"
        [routerLink]="['/app/prompts', promptId]"
      >
        <i class="pi pi-arrow-left"></i>
      </button>
      <h2>{{ 'PROMPT_MODULE.CONFIGURE_TITLE' | translate }}</h2>
    </div>
    <div class="action-buttons">
      <app-button
        variant="secondary"
        [disabled]="svc.currentStep() === 0"
        (clicked)="svc.back()"
      >
        {{ 'COMMON.BACK' | translate }}
      </app-button>
      <app-button
        *ngIf="svc.currentStep() < lastStep"
        [disabled]="!svc.stepValid()[svc.currentStep()]"
        (clicked)="svc.next()"
      >
        {{ 'COMMON.NEXT' | translate }}
      </app-button>
      <app-button
        *ngIf="svc.currentStep() === lastStep"
        icon="pi pi-save"
        [loading]="svc.saving()"
        [disabled]="!svc.canSave()"
        (clicked)="save()"
      >
        {{ 'COMMON.SAVE' | translate }}
      </app-button>
    </div>
  </div>

  <header class="cp__stepper">
    <button
      *ngFor="let s of steps; let i = index"
      type="button"
      class="cp__step"
      [class.cp__step--active]="svc.currentStep() === i"
      [class.cp__step--done]="svc.stepValid()[i] && svc.currentStep() > i"
      (click)="svc.goto(i)"
    >
      <i class="pi {{ s.icon }}"></i>
      <span>{{ s.titleKey | translate }}</span>
    </button>
  </header>

  <section class="cp__body">
    <cp-source-step *ngIf="svc.currentStep() === 0" [svc]="svc"></cp-source-step>
    <cp-joins-step *ngIf="svc.currentStep() === 1" [svc]="svc"></cp-joins-step>
    <cp-column-filter-step
      *ngIf="svc.currentStep() === 2"
      [svc]="svc"
    ></cp-column-filter-step>
    <cp-values-step
      *ngIf="svc.currentStep() === 3"
      [svc]="svc"
      [promptId]="promptId"
    ></cp-values-step>
  </section>
</div>
