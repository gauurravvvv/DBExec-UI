<div class="cp">
  <header class="cp__stepper">
    <button
      *ngFor="let s of steps; let i = index"
      type="button"
      class="cp__step"
      [class.cp__step--active]="svc.currentStep() === i"
      [class.cp__step--done]="svc.stepValid()[i] && svc.currentStep() > i"
      (click)="svc.goto(i)"
    >
      <i class="pi {{ s.icon }}"></i>
      <span>{{ s.titleKey | translate }}</span>
    </button>
  </header>

  <section class="cp__body">
    <cp-source-step *ngIf="svc.currentStep() === 0" [svc]="svc"></cp-source-step>
    <cp-joins-step *ngIf="svc.currentStep() === 1" [svc]="svc"></cp-joins-step>
    <cp-column-filter-step
      *ngIf="svc.currentStep() === 2"
      [svc]="svc"
    ></cp-column-filter-step>
    <cp-values-step
      *ngIf="svc.currentStep() === 3"
      [svc]="svc"
      [promptId]="promptId"
    ></cp-values-step>
  </section>

  <footer class="cp__nav">
    <app-button
      variant="secondary"
      [disabled]="svc.currentStep() === 0"
      (clicked)="svc.back()"
    >
      {{ 'COMMON.BACK' | translate }}
    </app-button>
    <app-button
      *ngIf="svc.currentStep() < lastStep"
      [disabled]="!svc.stepValid()[svc.currentStep()]"
      (clicked)="svc.next()"
    >
      {{ 'COMMON.NEXT' | translate }}
    </app-button>
    <app-button
      *ngIf="svc.currentStep() === lastStep"
      [loading]="svc.saving()"
      [disabled]="!svc.canSave()"
      (clicked)="save()"
    >
      {{ 'COMMON.SAVE' | translate }}
    </app-button>
  </footer>
</div>
