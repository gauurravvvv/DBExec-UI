<div class="cp-step">
  <app-custom-dropdown
    label="{{ 'PROMPT_MODULE.SCHEMA' | translate }}"
    [options]="schemas()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="svc.source().schema"
    (onChangeEvent)="onSchema($event)"
    appendTo="body"
  ></app-custom-dropdown>

  <app-custom-dropdown
    label="{{ 'PROMPT_MODULE.TABLE' | translate }}"
    [options]="tables()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="svc.source().table"
    (onChangeEvent)="onTable($event)"
    appendTo="body"
  ></app-custom-dropdown>

  <app-custom-input
    label="{{ 'PROMPT_MODULE.ALIAS' | translate }}"
    [ngModel]="svc.source().alias"
    (ngModelChange)="onAlias($event)"
  ></app-custom-input>

  <!-- Data type — drives the operator list in the Filter section. Defaulted
       from the widget at Add; override here. Free-form; these are suggestions. -->
  <app-custom-dropdown
    label="{{ 'PROMPT_MODULE.DATATYPE_LABEL' | translate }}"
    [options]="dataTypeOptions"
    optionLabel="label"
    optionValue="value"
    [showClear]="true"
    [ngModel]="svc.dataType()"
    (onChangeEvent)="onDataType($event)"
    appendTo="body"
  ></app-custom-dropdown>
</div>
