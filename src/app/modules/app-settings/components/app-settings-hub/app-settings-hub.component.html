<!-- App Settings hub — canonical list-screen chrome (parity with list-role):
     a page heading on the left and ONE common "Add" button top-right whose
     label + destination follow the active tab, then the shared themed tab
     strip, then the active tab's TABLE. The table sits flush on the page
     background (no card-in-card) — each child list renders only its
     <app-custom-table>. -->
<div class="settings-page-wrapper">
  <div class="settings-content-container">
    <!-- Header: title left, common Add right (list-role parity). -->
    <div class="page-header-section">
      <div class="header-content">
        <h2>{{ 'SIDEBAR.appSettings' | translate }}</h2>
      </div>

      <div class="header-actions">
        <button
          *hasPermission="currentAdd.permission; level: 'write'"
          pButton
          [label]="currentAdd.labelKey | translate"
          icon="pi pi-plus"
          (click)="onAdd()"
          class="p-button-raised p-button-primary modern-button"
        ></button>
      </div>
    </div>

    <!-- Shared themed tab strip. -->
    <app-tabs
      [tabs]="tabs"
      [active]="activeTab"
      (activeChange)="onTabChange($event)"
    ></app-tabs>

    <!-- Active tab body — only the selected list is instantiated. -->
    <div class="settings-tab-body" [ngSwitch]="activeTab">
      <app-list-themes *ngSwitchCase="'theme'"></app-list-themes>
      <app-list-branding *ngSwitchCase="'branding'"></app-list-branding>
      <app-list-announcements
        *ngSwitchCase="'announcements'"
      ></app-list-announcements>
    </div>
  </div>
</div>
