<!-- System Settings hub — canonical page chrome: a page heading on top, then
     the tab strip, then ONE full-height parent card holding the active tab.
     Each child (SSO / Email / Security / AI) renders its own sub-heading +
     form; the hub neutralises the child's own card so it sits flush inside
     this one (no card-in-card). -->
<div class="settings-page-wrapper">
  <div class="settings-content-container">
    <div class="content-card">
      <div class="page-header-section">
        <div class="header-content">
          <h2>{{ 'SIDEBAR.systemSettings' | translate }}</h2>
        </div>
        <div class="header-actions">
          <app-button
            variant="primary"
            icon="pi pi-save"
            [loading]="!!activeForm()?.busy"
            [disabled]="!activeForm()?.dirty || !!activeForm()?.busy"
            (clicked)="save()"
          >
            {{ 'COMMON.SAVE' | translate }}
          </app-button>
        </div>
      </div>

      <app-tabs
        [tabs]="tabs"
        [active]="activeTab"
        (activeChange)="onTabChange($event)"
      ></app-tabs>

      <div class="settings-tab-body" [ngSwitch]="activeTab">
        <app-sso-settings *ngSwitchCase="'sso'"></app-sso-settings>
        <app-email-configuration
          *ngSwitchCase="'email'"
        ></app-email-configuration>
        <app-security-policy *ngSwitchCase="'security'"></app-security-policy>
        <app-ai-features *ngSwitchCase="'ai'"></app-ai-features>
      </div>
    </div>
  </div>
</div>
