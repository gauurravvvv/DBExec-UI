<div class="add-admin-wrapper">
  <div class="add-admin-container">
    <!-- No inner header/reset button here: the hub already shows the
         page title + the single Save. Reset is per-section, in each
         accordion header. A small "default" badge sits above the list
         while the org is still on the platform defaults. -->
    <span *ngIf="isDefault" class="default-badge theme-default-badge">{{
      'THEME.DEFAULT_BADGE' | translate
    }}</span>

    <app-content-loader
      *ngIf="loading() && !themeForm.value.primary"
    ></app-content-loader>

    <form
      autocomplete="off"
      *ngIf="!loading() || themeForm.value.primary"
      [formGroup]="themeForm"
      class="admin-form theme-form"
    >
      <!-- One collapsible section per token group. Each token pairs a
           hex text input with a native <input type="color"> swatch,
           both bound to the same control. Editing live-previews on
           this tab; Save persists for everyone on next sign-in. -->
      <div
        class="token-group"
        *ngFor="let g of groups; trackBy: trackByGroup"
      >
        <!-- Header row: the toggle button + a section-scoped reset. The
             two are siblings (not nested buttons) so the markup stays
             valid; the reset stops propagation so it never toggles. -->
        <div class="token-group__header" [class.open]="g.open">
          <button
            type="button"
            class="token-group__toggle"
            (click)="toggleGroup(g)"
            [attr.aria-expanded]="g.open"
          >
            <i
              class="pi"
              [ngClass]="g.open ? 'pi-chevron-down' : 'pi-chevron-right'"
            ></i>
            <span class="token-group__title">{{
              'THEME_SETTINGS.GROUPS.' + (g.group | uppercase) | translate
            }}</span>
            <span class="token-group__count">{{ g.tokens.length }}</span>
          </button>
          <button
            type="button"
            class="token-group__reset"
            [disabled]="resettingGroup === g.group || resetting()"
            [pTooltip]="'THEME_SETTINGS.RESET_SECTION' | translate"
            tooltipPosition="left"
            (click)="resetSection(g, $event)"
          >
            <i
              class="pi"
              [ngClass]="
                resettingGroup === g.group ? 'pi-spin pi-spinner' : 'pi-refresh'
              "
            ></i>
            <span>{{ 'THEME_SETTINGS.RESET' | translate }}</span>
          </button>
        </div>

        <div class="token-group__body" *ngIf="g.open">
          <div class="color-row" *ngFor="let t of g.tokens">
            <app-custom-input
              [formControlName]="t.key"
              [label]="'THEME_SETTINGS.TOKENS.' + t.labelKey | translate"
              [placeholder]="
                t.key === 'primary'
                  ? ('THEME.PRIMARY_PLACEHOLDER' | translate)
                  : ('THEME.HEX_PLACEHOLDER' | translate)
              "
              icon="pi-palette"
              [required]="t.key === 'primary'"
              [showError]="showFieldError(t.key)"
              [errorMessage]="
                (t.key === 'primary'
                  ? 'THEME.HEX_REQUIRED'
                  : 'THEME.HEX_INVALID'
                ) | translate
              "
            ></app-custom-input>
            <label
              class="color-swatch"
              [style.background-color]="swatchValue(t.key)"
            >
              <input
                type="color"
                [value]="swatchValue(t.key)"
                (input)="onColorPicked(t.key, $any($event.target).value)"
                aria-hidden="true"
                tabindex="-1"
              />
            </label>
          </div>
        </div>
      </div>
    </form>

    <!-- Sign-in hint — a fixed footnote OUTSIDE the scroll form so it
         doesn't trail the last section as a tinted box (which read as a
         bottom "gap"). -->
    <p class="theme-hint" *ngIf="!loading() || themeForm.value.primary">
      <i class="pi pi-info-circle"></i>
      {{ 'THEME.RE_LOGIN_HINT' | translate }}
    </p>
  </div>
</div>
