<div class="confirmation-popup" *ngIf="visible">
  <div class="popup-content">
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-icon">
        <i class="pi pi-save"></i>
      </div>
      <h3>{{ dialogTitle }}</h3>
    </div>

    <!-- Form Body -->
    <div class="popup-body">
      <form [formGroup]="datasetForm">
        <!-- Dataset Name -->
        <div class="form-field">
          <app-custom-input
            formControlName="name"
            [label]="'COMMON.NAME' | translate"
            [placeholder]="'DATASET.ENTER_DATASET_NAME' | translate"
            icon="pi-id-card"
            [required]="true"
            [showError]="
              !!(
                datasetForm.get('name')?.invalid &&
                datasetForm.get('name')?.touched
              )
            "
            [errorMessage]="getNameError()"
          >
          </app-custom-input>
        </div>

        <!-- Description -->
        <div class="form-field">
          <app-custom-input
            formControlName="description"
            [label]="'COMMON.DESCRIPTION' | translate"
            [placeholder]="'DATASET.ENTER_DATASET_DESCRIPTION' | translate"
            icon="pi-align-left"
          >
          </app-custom-input>
          <small class="char-count">
            {{ datasetForm.get('description')?.value?.length || 0 }}/500
            {{ 'COMMON.CHARACTERS' | translate }}
          </small>
        </div>

        <!-- Result cache -->
        <div class="form-field cache-section">
          <app-custom-toggle
            formControlName="cacheEnabled"
            [label]="'DATASET.CACHE.LABEL' | translate"
            [trueLabel]="'DATASET.CACHE.ON' | translate"
            [falseLabel]="'DATASET.CACHE.OFF' | translate"
          >
          </app-custom-toggle>
          <small class="cache-hint">
            {{ 'DATASET.CACHE.HINT' | translate }}
          </small>

          <!-- TTL only relevant when caching is on -->
          <div class="cache-ttl-field" *ngIf="cacheEnabled">
            <app-custom-number
              formControlName="cacheTtlSeconds"
              [label]="'DATASET.CACHE.TTL_LABEL' | translate"
              [placeholder]="'DATASET.CACHE.TTL_PLACEHOLDER' | translate"
              [min]="cacheTtlMin"
              [max]="cacheTtlMax"
              [suffix]="' ' + ('DATASET.CACHE.SECONDS' | translate)"
              [showError]="
                !!(
                  datasetForm.get('cacheTtlSeconds')?.invalid &&
                  datasetForm.get('cacheTtlSeconds')?.touched
                )
              "
              [errorMessage]="getCacheTtlError()"
            >
            </app-custom-number>
            <small class="cache-hint">
              {{ 'DATASET.CACHE.TTL_HINT' | translate }}
            </small>
          </div>
        </div>

        <!-- Justification (for updates) -->
        <div class="form-field justification-section" *ngIf="showJustification">
          <label for="justification"
            >{{ 'COMMON.JUSTIFICATION' | translate }}
            <span class="required">*</span></label
          >
          <textarea
            id="justification"
            formControlName="justification"
            [placeholder]="
              'COMMON.JUSTIFICATION_UPDATE_PLACEHOLDER' | translate
            "
            rows="3"
            maxlength="500"
          ></textarea>
          <small class="char-count">
            {{ datasetForm.get('justification')?.value?.length || 0 }}/500
          </small>
        </div>
      </form>
    </div>

    <!-- Actions -->
    <div class="popup-actions">
      <button class="btn-cancel" (click)="onCancel()">
        <i class="pi pi-times"></i>
        {{ 'COMMON.CANCEL' | translate }}
      </button>
      <button
        class="btn-confirm"
        [disabled]="datasetForm.invalid || saving"
        (click)="onSubmit()"
      >
        <i
          class="pi"
          [ngClass]="saving ? 'pi-spin pi-spinner' : 'pi-save'"
        ></i>
        {{ 'DATASET.SAVE_DATASET' | translate }}
      </button>
    </div>
  </div>
</div>
