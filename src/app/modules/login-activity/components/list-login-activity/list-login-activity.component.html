<div class="dataset-page-wrapper">
  <div class="dataset-content-container">
    <!-- Header Section -->
    <div class="page-header-section">
      <div class="header-content">
        <h2>{{ 'LOGIN_ACTIVITY.TITLE' | translate }}</h2>
      </div>

      <div class="header-actions">
        <button
          pButton
          [icon]="isExporting ? 'pi pi-spin pi-spinner' : 'pi pi-file-pdf'"
          [pTooltip]="'COMMON.EXPORT_PDF' | translate"
          tooltipPosition="top"
          (click)="exportActivity('pdf')"
          [disabled]="isExporting || totalItems === 0"
          class="p-button-outlined p-button-danger modern-button"
        ></button>
        <button
          pButton
          [label]="'COMMON.CLEAR' | translate"
          icon="pi pi-filter-slash"
          (click)="clearFilters()"
          [disabled]="!isFilterActive"
          class="p-button-outlined p-button-danger modern-button"
        ></button>
      </div>
    </div>

    <!-- Unified Toolbar & Content Card -->
    <div class="content-card">
      <!-- AG Grid via us-data-grid. Read-only: no row selection, no
           row actions, no bulk-delete. Per-cell DOM is supplied via
           <ng-template usGridCell> so the visual look — username link,
           event badge, failure-reason text, relative timestamp, ip /
           user-agent text — matches the previous PrimeNG layout. -->
      <div class="table-wrapper" *ngIf="adapter">
        <us-data-grid
          [columns]="cols"
          [serverAdapter]="adapter"
          [config]="gridConfig"
          (refresh)="refreshList()"
        >
          <ng-template usGridCell="username" let-activity>
            <a class="dataset-name-link" [title]="activity.username">
              {{ activity.username || '-' }}
            </a>
          </ng-template>

          <ng-template usGridCell="eventType" let-activity>
            <span
              class="event-badge"
              [ngClass]="getEventClass(activity.eventType)"
            >
              {{ activity.eventType | replaceUnderscores }}
            </span>
          </ng-template>

          <ng-template usGridCell="failureReason" let-activity>
            <span
              class="description-text"
              *ngIf="activity.failureReason"
              [title]="activity.failureReason"
            >
              {{ activity.failureReason | replaceUnderscores }}
            </span>
            <span class="description-text" *ngIf="!activity.failureReason"
              >-</span
            >
          </ng-template>

          <ng-template usGridCell="createdOn" let-activity>
            <span
              class="date-text"
              [pTooltip]="(activity.createdOn | date: 'dd MMM yyyy, HH:mm:ss') || ''"
              tooltipPosition="top"
              >{{ activity.createdOn | relativeTime }}</span
            >
          </ng-template>

          <ng-template usGridCell="ipAddress" let-activity>
            <span class="description-text">{{ activity.ipAddress || '-' }}</span>
          </ng-template>

          <ng-template usGridCell="userAgent" let-activity>
            <span
              class="description-text user-agent-text"
              [title]="activity.userAgent"
              >{{ activity.userAgent || '-' }}</span
            >
          </ng-template>
        </us-data-grid>
      </div>
    </div>
  </div>
</div>
