<div class="add-admin-wrapper">
  <div class="add-admin-container">
    <!-- Header Section -->
    <div class="page-header">
      <div class="left-section">
        <button
          pButton
          class="p-button-text back-button"
          routerLink="/app/system-admin"
        >
          <i class="pi pi-arrow-left"></i>
        </button>
        <h2>{{ 'SYSTEM_ADMIN.EDIT_TITLE' | translate }}</h2>
      </div>
      <div class="action-buttons">
        <app-button
          variant="secondary"
          [disabled]="!isFormDirty"
          (clicked)="onCancel()"
          >{{ 'COMMON.CANCEL' | translate }}</app-button
        >
        <app-button
          *hasPermission="'systemAdmin'; level: 'write'"
          variant="primary"
          icon="pi pi-save"
          [loading]="saving()"
          [disabled]="
            adminForm.invalid || !isFormDirty || saving() || !adminData
          "
          (clicked)="onSubmit()"
          >{{ 'COMMON.SAVE' | translate }}</app-button
        >
      </div>
    </div>

    <!-- Centered branded loader while the initial GET is in flight.
         Page chrome above stays clickable. -->
    <app-content-loader *ngIf="loading() && !adminData"></app-content-loader>

    <!-- Form Section -->
    <form
      autocomplete="off"
      *ngIf="adminData"
      [formGroup]="adminForm"
      class="admin-form"
    >
      <div class="form-grid">
        <!-- Full Name -->
        <app-custom-input
          formControlName="fullName"
          [label]="'COMMON.FULL_NAME' | translate"
          [placeholder]="'COMMON.ENTER_FULL_NAME' | translate"
          icon="pi-user"
          [required]="true"
          [showError]="
            !!(
              adminForm.get('fullName')?.invalid &&
              adminForm.get('fullName')?.touched
            )
          "
          [errorMessage]="getFullNameError()"
        >
        </app-custom-input>

        <!-- Username (disabled) -->
        <app-custom-input
          formControlName="username"
          [label]="'COMMON.USERNAME' | translate"
          [placeholder]="'COMMON.ENTER_USERNAME' | translate"
          icon="pi-user"
          [required]="true"
          [inputDisabled]="true"
        >
        </app-custom-input>

        <!-- Email -->
        <app-custom-input
          formControlName="email"
          [label]="'COMMON.EMAIL' | translate"
          [placeholder]="'COMMON.ENTER_EMAIL' | translate"
          icon="pi-envelope"
          type="email"
          [required]="true"
          [showError]="
            !!(
              adminForm.get('email')?.invalid && adminForm.get('email')?.touched
            )
          "
          [errorMessage]="getEmailError()"
        >
        </app-custom-input>

        <!-- Status -->
        <div>
          <app-custom-toggle
            formControlName="status"
            [label]="'COMMON.STATUS' | translate"
            [trueValue]="1"
            [falseValue]="0"
            [trueLabel]="'COMMON.ACTIVE' | translate"
            [falseLabel]="'COMMON.INACTIVE' | translate"
          >
          </app-custom-toggle>
          <small *ngIf="isLocked" class="locked-note">
            <i class="pi pi-lock"></i>
            {{ 'COMMON.LOCKED_NOTE' | translate }}
          </small>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="confirmation-popup" *ngIf="showSaveConfirm">
  <div class="popup-content">
    <div class="popup-header">
      <div class="popup-icon">
        <i class="pi pi-save"></i>
      </div>
      <h3>{{ 'COMMON.CONFIRM_UPDATE' | translate }}</h3>
    </div>

    <div class="standard-delete-section">
      <p class="delete-intro">
        {{ 'SYSTEM_ADMIN.UPDATE_CONFIRM' | translate }}
      </p>

      <div class="justification-section">
        <label for="saveJustification"
          >{{ 'COMMON.JUSTIFICATION' | translate }}
          <span class="required">*</span></label
        >
        <app-custom-textarea
          inputId="saveJustification"
          [(ngModel)]="saveJustification"
          [placeholder]="'COMMON.JUSTIFICATION_UPDATE_PLACEHOLDER' | translate"
          [rows]="3"
          [maxLength]="500"
        ></app-custom-textarea>
        <small class="char-count">{{ saveJustification.length }}/500</small>
      </div>
    </div>

    <div class="popup-actions">
      <button class="btn-cancel" (click)="cancelSave()">
        <i class="pi pi-times"></i>
        {{ 'COMMON.CANCEL' | translate }}
      </button>
      <button
        class="btn-confirm"
        (click)="proceedSave()"
        [disabled]="!saveJustification.trim() || saving()"
      >
        <i
          class="pi"
          [ngClass]="saving() ? 'pi-spin pi-spinner' : 'pi-check'"
        ></i>
        {{ 'COMMON.UPDATE' | translate }}
      </button>
    </div>
  </div>
</div>
