<div class="add-admin-wrapper">
  <div class="add-admin-container">
    <!-- Header Section -->
    <div class="page-header">
      <div class="left-section">
        <button
          pButton
          class="p-button-text back-button"
          routerLink="/app/system-admin"
        >
          <i class="pi pi-arrow-left"></i>
        </button>
        <h2>{{ 'SYSTEM_ADMIN.ADD_TITLE' | translate }}</h2>
      </div>
      <div class="action-buttons">
        <app-button
          variant="secondary"
          [disabled]="!isFormDirty"
          (clicked)="onCancel()"
          >{{ 'COMMON.CANCEL' | translate }}</app-button
        >
        <!-- Button-level spinner keeps the global blocker off; the user can
             still see the form while the POST is in flight (this button is
             disabled, the fields aren't). -->
        <app-button
          *hasPermission="'systemAdmin'; level: 'write'"
          variant="primary"
          icon="pi pi-save"
          [loading]="saving()"
          [disabled]="adminForm.invalid || saving()"
          (clicked)="onSubmit()"
          >{{ 'COMMON.SAVE' | translate }}</app-button
        >
      </div>
    </div>

    <!-- Form Section -->
    <form autocomplete="off" [formGroup]="adminForm" class="admin-form">
      <div class="form-grid">
        <!-- Full Name -->
        <app-custom-input
          formControlName="fullName"
          [label]="'COMMON.FULL_NAME' | translate"
          [placeholder]="'COMMON.ENTER_FULL_NAME' | translate"
          icon="pi-user"
          [required]="true"
          [showError]="
            !!(
              adminForm.get('fullName')?.invalid &&
              adminForm.get('fullName')?.touched
            )
          "
          [errorMessage]="getFullNameError()"
        >
        </app-custom-input>

        <!-- Username -->
        <app-custom-input
          formControlName="username"
          [label]="'COMMON.USERNAME' | translate"
          [placeholder]="'COMMON.ENTER_USERNAME' | translate"
          icon="pi-user"
          [required]="true"
          [showError]="
            !!(
              adminForm.get('username')?.invalid &&
              adminForm.get('username')?.touched
            )
          "
          [errorMessage]="getUsernameError()"
        >
        </app-custom-input>

        <!-- Email -->
        <app-custom-input
          formControlName="email"
          [label]="'COMMON.EMAIL' | translate"
          [placeholder]="'COMMON.ENTER_EMAIL' | translate"
          icon="pi-envelope"
          type="email"
          [required]="true"
          [showError]="
            !!(
              adminForm.get('email')?.invalid && adminForm.get('email')?.touched
            )
          "
          [errorMessage]="getEmailError()"
        >
        </app-custom-input>
      </div>
    </form>
  </div>
</div>
